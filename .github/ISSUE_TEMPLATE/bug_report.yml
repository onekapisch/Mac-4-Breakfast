name: 🐞 Bug report
description: Something isn't working right in Mac 4 Breakfast
title: "[Bug]: "
labels: ["bug"]
body:
  - type: input
    id: version
    attributes:
      label: App version
      description: Open Settings (the gear in the menu-bar popover); the app version is shown at the bottom.
      placeholder: "e.g. 0.2.4"
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: macOS version & Mac model
      placeholder: "e.g. macOS 14.5 · MacBook Pro (M3)"
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What went wrong, and what did you expect to happen instead?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. …
        2. …
        3. …
    validations:
      required: false
